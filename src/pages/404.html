<!-- meta: page=404 | title=Page not found — Momentum | description=This page has moved or no longer exists. -->
{{> head}}
<main id="main">
  <section class="notfound">
    <div class="stack">
      <span class="label" data-fade="intro">Error 404 — lost in the frame</span>
      <p class="notfound-num" aria-hidden="true">404</p>
      <h1 class="h2" data-split="intro">This moment <em>slipped away.</em></h1>
      <p class="ink-2" data-fade="intro" style="max-width:40ch;margin-inline:auto">The page you're looking for has moved or no longer exists. Let's get you back to the good stuff.</p>
      <div class="hero-ctas" style="justify-content:center" data-fade="intro">
        <a class="btn btn--accent" href="index.html" data-label="Home"><span class="btn-text"><span data-text="Back to home">Back to home</span></span>{{icon arrow}}</a>
        <a class="btn btn--ghost" href="work.html" data-label="Work"><span class="btn-text"><span data-text="View the work">View the work</span></span></a>
      </div>
    </div>
  </section>
</main>
{{> scripts}}
