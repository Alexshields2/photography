<section class="cta section" aria-labelledby="cta-title">
  <div class="cta-bg" data-parallax="6">{{img wedding-07||100vw}}</div>
  <div class="wrap">
    <span class="label" data-fade>Now booking 2027 &amp; 2028</span>
    <div class="cta-grid" style="margin-top:32px">
      <h2 class="cta-title" id="cta-title" data-split>Let's make something <em>timeless</em>.</h2>
      <a class="circle-btn" href="contact.html" data-magnetic="0.4" data-label="Let's talk">Check your<br>date {{icon arrow}}</a>
    </div>
    <ul class="cta-notes" data-fade>
      <li>{{icon clock}} Reply within 24 hours</li>
      <li>{{icon shield}} No-obligation consultation</li>
      <li>{{icon lock}} Your date held for 7 days</li>
    </ul>
  </div>
</section>
